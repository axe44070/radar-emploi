<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Radar emploi</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f6f4; --surface: #fcfcfb; --surface-2: #f0efec; --border: #e2e1dc;
  --text: #0b0b0b; --text-2: #52514e; --muted: #7a7974;
  --accent: #2a78d6; --accent-soft: #e6f0fc; --series: #2a78d6;
  --good: #0ca30c; --warning: #b37a00; --critical: #d03b3b; --neutral: #8a8984;
  --new: #eb6834;
  --radius: 10px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #242422; --border: #33332f;
    --text: #ffffff; --text-2: #c3c2b7; --muted: #8f8e86;
    --accent: #6da7ec; --accent-soft: #1c2a3d; --series: #3987e5;
    --good: #2fbf2f; --warning: #fab219; --critical: #e66767; --new: #f08a5d;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #242422; --border: #33332f;
  --text: #ffffff; --text-2: #c3c2b7; --muted: #8f8e86;
  --accent: #6da7ec; --accent-soft: #1c2a3d; --series: #3987e5;
  --good: #2fbf2f; --warning: #fab219; --critical: #e66767; --new: #f08a5d;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.45; }
a { color: var(--accent); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 18px; }
h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 15px; margin: 0 0 12px; }
.sub { color: var(--text-2); }
.spacer { flex: 1; }
button, select, input { font: inherit; color: var(--text); }
.btn { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.banner { border-radius: var(--radius); padding: 10px 14px; margin-bottom: 16px; border: 1px solid; }
.banner.warn { border-color: var(--warning); background: color-mix(in srgb, var(--warning) 10%, var(--surface)); }
.banner.err { border-color: var(--critical); background: color-mix(in srgb, var(--critical) 10%, var(--surface)); }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.kpi .label { color: var(--text-2); font-size: 13px; }
.kpi .value { font-size: 28px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; }
.kpi .hint { color: var(--muted); font-size: 12px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 12px; margin-bottom: 16px; align-items: start; }
#chart { position: relative; }
#chart svg { display: block; width: 100%; height: 200px; overflow: visible; }
#chart .bar { fill: var(--series); }
#chart .hit { fill: transparent; cursor: default; }
#chart .hit:hover + .bar, #chart .bar.on { opacity: .75; }
#chart .axis { fill: var(--muted); font-size: 11px; }
#chart .grid { stroke: var(--border); stroke-width: 1; }
.tip { position: absolute; pointer-events: none; background: var(--text); color: var(--surface); padding: 5px 9px; border-radius: 6px; font-size: 12px; white-space: nowrap; transform: translate(-50%, -110%); display: none; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--text-2); font-weight: 550; font-size: 12px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.num { white-space: nowrap; }
.status { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.err-msg { color: var(--critical); font-size: 12px; word-break: break-word; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.filters input[type=search] { flex: 1 1 220px; min-width: 0; }
.filters input[type=search], .filters select { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; }
.filters label { display: inline-flex; gap: 6px; align-items: center; color: var(--text-2); }
.count { color: var(--text-2); margin-bottom: 8px; }
.jobs { display: flex; flex-direction: column; gap: 8px; }
.job { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; }
.job.dim { opacity: .55; }
.job .t { font-weight: 600; font-size: 15px; text-decoration: none; color: var(--text); }
.job .t:hover { color: var(--accent); text-decoration: underline; }
.job .meta { color: var(--text-2); }
.job .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--border); }
.chip.p { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.new { background: var(--new); color: #fff; border-color: transparent; font-weight: 600; }
.chip.chk { border-style: dashed; }
.job .side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.job .when { color: var(--muted); font-size: 12px; white-space: nowrap; }
.job select { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; font-size: 13px; }
.empty { text-align: center; color: var(--text-2); padding: 40px 0; }
.more { margin: 14px auto 0; display: block; }
@media (max-width: 820px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .job { grid-template-columns: minmax(0, 1fr); }
  .job .side { flex-direction: row; align-items: center; justify-content: space-between; }
  .hide-sm { display: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Radar emploi</h1>
    <span class="sub" id="lastRun">Chargement…</span>
    <span class="spacer"></span>
    <button class="btn" id="exportBtn" title="Exporter la sélection en CSV">Exporter CSV</button>
    <button class="btn" id="themeBtn" title="Changer de thème" aria-label="Changer de thème">Thème</button>
  </header>

  <div id="banners"></div>

  <section class="kpis" aria-label="Indicateurs">
    <div class="card kpi"><div class="label">Nouvelles · 24 h</div><div class="value" id="k24">–</div><div class="hint" id="k24h"></div></div>
    <div class="card kpi"><div class="label">Nouvelles · 7 jours</div><div class="value" id="k7">–</div><div class="hint" id="k7h"></div></div>
    <div class="card kpi"><div class="label">Candidatures en cours</div><div class="value" id="kApp">–</div><div class="hint">postulé + entretien</div></div>
    <div class="card kpi"><div class="label">Sources opérationnelles</div><div class="value" id="kSrc">–</div><div class="hint" id="kSrcH"></div></div>
  </section>

  <section class="grid2">
    <div class="card">
      <h2>Nouvelles offres par jour · 30 derniers jours</h2>
      <div id="chart" role="img" aria-label="Histogramme des nouvelles offres par jour"><div class="tip" id="tip"></div></div>
    </div>
    <div class="card">
      <h2>État des sources</h2>
      <div style="overflow-x:auto"><table id="srcTable"><thead><tr><th>Source</th><th>État</th><th class="num hide-sm">Dernier succès</th><th class="num" title="Offres reçues au dernier passage · offres retenues par vos filtres">Reçues · gardées</th></tr></thead><tbody></tbody></table></div>
    </div>
  </section>

  <section class="card">
    <div class="filters">
      <input type="search" id="q" placeholder="Rechercher un titre, une entreprise, une ville…" aria-label="Rechercher">
      <select id="fProfile" aria-label="Profil"><option value="">Tous les profils</option></select>
      <select id="fSource" aria-label="Source"><option value="">Toutes les sources</option></select>
      <select id="fPeriod" aria-label="Période">
        <option value="1">24 h</option><option value="3">3 jours</option><option value="7" selected>7 jours</option>
        <option value="30">30 jours</option><option value="0">Tout</option>
      </select>
      <select id="fStatus" aria-label="Statut"><option value="">Tous les statuts</option></select>
      <label><input type="checkbox" id="fHide" checked> Masquer ignorées / refusées</label>
      <label><input type="checkbox" id="fPrio"> ⭐ seulement</label>
    </div>
    <div class="count" id="count"></div>
    <div class="jobs" id="jobs"></div>
    <button class="btn more" id="moreBtn" hidden>Afficher plus</button>
  </section>
</div>

<script>
(() => {
  const STATUSES = [["", "À traiter"], ["interesting", "Intéressant"], ["applied", "Postulé"],
                    ["interview", "Entretien"], ["rejected", "Refusé"], ["ignored", "Ignoré"]];
  const SRC_NAMES = { francetravail: "France Travail", apec: "APEC", adzuna: "Adzuna", google_jobs: "Google Jobs" };
  const PAGE = 60;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const srcLabel = (s) => SRC_NAMES[s] || (s.includes(":") ? `${s.split(":").slice(1).join(":")} (${s.split(":")[0]})` : s);

  // ---------- stockage local (statuts de candidature, dernière visite, thème)
  const ls = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  let statuses = ls.get("radar.statuses", {});
  const prevVisit = ls.get("radar.lastVisit", null);
  ls.set("radar.lastVisit", new Date().toISOString());

  const theme = ls.get("radar.theme", null);
  if (theme) document.documentElement.dataset.theme = theme;
  $("themeBtn").onclick = () => {
    const dark = getComputedStyle(document.documentElement).colorScheme.includes("dark");
    const next = dark ? "light" : "dark";
    document.documentElement.dataset.theme = next; ls.set("radar.theme", next);
  };

  // ---------- temps
  const now = Date.now();
  const ago = (iso) => {
    if (!iso) return "–";
    const m = Math.round((now - Date.parse(iso)) / 60000);
    if (m < 1) return "à l'instant";
    if (m < 60) return `il y a ${m} min`;
    const h = Math.round(m / 60);
    if (h < 24) return `il y a ${h} h`;
    const d = Math.round(h / 24);
    return d === 1 ? "hier" : `il y a ${d} j`;
  };
  const fmtDate = (iso) => new Date(iso).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" });

  // ---------- chargement
  async function load() {
    if (window.RADAR_DATA) return window.RADAR_DATA;
    const bust = "?t=" + Math.floor(now / 60000);
    const get = (f) => fetch("data/" + f + bust).then((r) => (r.ok ? r.json() : null)).catch(() => null);
    const [jobs, state, runs] = await Promise.all([get("jobs.json"), get("state.json"), get("runs.json")]);
    return { jobs: jobs || [], state: state || { sources: {} }, runs: runs || [] };
  }

  load().then(({ jobs, state, runs }) => {
    const banners = [];
    const lastRun = state.last_run;
    $("lastRun").textContent = lastRun ? `Dernier passage ${ago(lastRun)} · ${fmtDate(lastRun)}` : "Aucun passage pour l'instant";
    if (!lastRun) banners.push(["warn", "Le radar n'a pas encore tourné. Lancez le workflow « Radar emploi » depuis l'onglet Actions de GitHub."]);
    else {
      const hours = (now - Date.parse(lastRun)) / 3.6e6;
      const h = new Date().getHours();
      if (hours > 3 && h >= 7 && h <= 23) banners.push(["err", `Le radar n'a pas tourné depuis ${Math.round(hours)} h. Vérifiez l'onglet Actions de votre dépôt GitHub.`]);
    }
    const lastRec = runs[runs.length - 1];
    if (lastRec?.notification_errors?.length) banners.push(["err", "Envoi d'alertes en échec au dernier passage : " + lastRec.notification_errors.join(" · ")]);
    $("banners").innerHTML = banners.map(([k, t]) => `<div class="banner ${k}">${esc(t)}</div>`).join("");

    // ---------- KPI
    const fresh = jobs.filter((j) => !j.initial);
    const within = (j, days) => now - Date.parse(j.first_seen) < days * 864e5;
    $("k24").textContent = fresh.filter((j) => within(j, 1)).length;
    $("k7").textContent = fresh.filter((j) => within(j, 7)).length;
    const newSince = prevVisit ? fresh.filter((j) => j.first_seen > prevVisit).length : 0;
    $("k24h").textContent = prevVisit ? `${newSince} depuis votre dernière visite` : "";
    $("k7h").textContent = `${jobs.length} offres suivies au total`;
    const refreshApps = () => { $("kApp").textContent = Object.values(statuses).filter((s) => s === "applied" || s === "interview").length; };
    refreshApps();

    // ---------- sources
    const COLORS = { ok: ["var(--good)", "OK"], en_attente: ["var(--good)", "OK · en pause"], erreur: ["var(--critical)", "En panne"], non_configuree: ["var(--neutral)", "Non configurée"] };
    const ICONS = { ok: "✓", en_attente: "✓", erreur: "✕", non_configuree: "–" };
    const srcs = Object.entries(state.sources || {});
    const okCount = srcs.filter(([, v]) => v.status === "ok" || v.status === "en_attente").length;
    const configured = srcs.filter(([, v]) => v.status !== "non_configuree").length;
    $("kSrc").textContent = srcs.length ? `${okCount}/${configured}` : "–";
    const unconf = srcs.length - configured;
    $("kSrcH").textContent = unconf ? `${unconf} non configurée(s)` : srcs.length ? "toutes configurées" : "";
    $("srcTable").tBodies[0].innerHTML = srcs.length ? srcs.map(([k, v]) => {
      const [c, l] = COLORS[v.status] || ["var(--neutral)", v.status || "?"];
      const err = v.status === "erreur" || v.status === "non_configuree" ? `<div class="err-msg">${esc(v.last_error || "")}</div>` : "";
      return `<tr><td>${esc(srcLabel(k))}${err}</td><td><span class="status"><span class="dot" style="background:${c}"></span>${ICONS[v.status] || ""} ${l}</span></td>
        <td class="num hide-sm">${v.last_ok ? ago(v.last_ok) : "jamais"}</td><td class="num">${v.last_count ?? "–"} · ${v.last_kept ?? "–"}</td></tr>`;
    }).join("") : `<tr><td colspan="4" class="sub">Aucune donnée.</td></tr>`;

    // ---------- histogramme (une série : pas de légende, le titre la nomme)
    const days = 30, counts = new Array(days).fill(0), labels = [];
    const today = new Date(); today.setHours(0, 0, 0, 0);
    for (let i = days - 1; i >= 0; i--) labels.push(new Date(today.getTime() - i * 864e5));
    fresh.forEach((j) => {
      const d = new Date(j.first_seen); d.setHours(0, 0, 0, 0);
      const idx = days - 1 - Math.round((today - d) / 864e5);
      if (idx >= 0 && idx < days) counts[idx]++;
    });
    const W = Math.max(280, $("chart").clientWidth), H = 200, padL = 28, padB = 20, max = Math.max(4, ...counts);
    const nice = Math.ceil(max / 4) * 4, bw = (W - padL) / days, y = (v) => (H - padB) * (1 - v / nice);
    let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;
    for (let t = 0; t <= 4; t++) {
      const v = (nice / 4) * t, yy = y(v);
      svg += `<line class="grid" x1="${padL}" x2="${W}" y1="${yy}" y2="${yy}"/><text class="axis" x="${padL - 6}" y="${yy + 4}" text-anchor="end">${v}</text>`;
    }
    counts.forEach((c, i) => {
      const x = padL + i * bw + 1, w = Math.max(2, bw - 2), top = y(c), h = H - padB - top;
      const r = Math.min(4, w / 2, h);
      const path = h > 0 ? `M${x},${H - padB}V${top + r}Q${x},${top} ${x + r},${top}H${x + w - r}Q${x + w},${top} ${x + w},${top + r}V${H - padB}Z` : "";
      svg += `<rect class="hit" data-i="${i}" x="${x - 1}" y="0" width="${bw}" height="${H - padB}"/>`;
      if (path) svg += `<path class="bar" data-b="${i}" d="${path}"/>`;
      if ((W > 480 ? i % 7 === 2 : i % 10 === 2) || i === days - 1) svg += `<text class="axis" x="${x + w / 2}" y="${H - 4}" text-anchor="middle">${labels[i].toLocaleDateString("fr-FR", { day: "numeric", month: "short" })}</text>`;
    });
    svg += "</svg>";
    $("chart").insertAdjacentHTML("beforeend", svg);
    const tip = $("tip"), chart = $("chart");
    chart.querySelectorAll(".hit").forEach((el) => {
      el.addEventListener("mouseenter", () => {
        const i = +el.dataset.i, box = chart.getBoundingClientRect(), r = el.getBoundingClientRect();
        tip.textContent = `${labels[i].toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" })} : ${counts[i]} offre${counts[i] > 1 ? "s" : ""}`;
        tip.style.display = "block";
        const half = tip.offsetWidth / 2, cx = r.left - box.left + r.width / 2;
        tip.style.left = Math.min(Math.max(cx, half), box.width - half) + "px";
        tip.style.top = Math.max(18, y(counts[i])) + "px";
        chart.querySelector(`[data-b="${i}"]`)?.classList.add("on");
      });
      el.addEventListener("mouseleave", () => { tip.style.display = "none"; chart.querySelectorAll(".bar.on").forEach((b) => b.classList.remove("on")); });
    });

    // ---------- filtres
    const profiles = [...new Set(jobs.flatMap((j) => j.profiles || []))].sort();
    const sources = [...new Set(jobs.flatMap((j) => j.sources.map((s) => s.source)))].sort();
    $("fProfile").insertAdjacentHTML("beforeend", profiles.map((p) => `<option>${esc(p)}</option>`).join(""));
    $("fSource").insertAdjacentHTML("beforeend", sources.map((s) => `<option value="${esc(s)}">${esc(srcLabel(s))}</option>`).join(""));
    $("fStatus").insertAdjacentHTML("beforeend", STATUSES.map(([v, l]) => `<option value="${v || "todo"}">${l}</option>`).join(""));
    const saved = ls.get("radar.filters", {});
    ["q", "fProfile", "fSource", "fPeriod", "fStatus"].forEach((id) => { if (saved[id] !== undefined) $(id).value = saved[id]; });
    ["fHide", "fPrio"].forEach((id) => { if (saved[id] !== undefined) $(id).checked = saved[id]; });

    let shown = PAGE, current = [];
    const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

    function filter() {
      const q = norm($("q").value.trim()), p = $("fProfile").value, s = $("fSource").value;
      const period = +$("fPeriod").value, st = $("fStatus").value, hide = $("fHide").checked, prio = $("fPrio").checked;
      ls.set("radar.filters", { q: $("q").value, fProfile: p, fSource: s, fPeriod: $("fPeriod").value, fStatus: st, fHide: hide, fPrio: prio });
      return jobs.filter((j) => {
        const status = statuses[j.id] || "";
        if (q && !norm(`${j.title} ${j.company} ${j.location}`).includes(q)) return false;
        if (p && !(j.profiles || []).includes(p)) return false;
        if (s && !j.sources.some((x) => x.source === s)) return false;
        if (period && !within(j, period)) return false;
        if (st && (st === "todo" ? status !== "" : status !== st)) return false;
        if (hide && !st && (status === "ignored" || status === "rejected")) return false;
        if (prio && !j.priority) return false;
        return true;
      }).sort((a, b) => (b.first_seen > a.first_seen ? 1 : b.first_seen < a.first_seen ? -1 : (b.score || 0) - (a.score || 0)));
    }

    function card(j) {
      const status = statuses[j.id] || "";
      const isNew = prevVisit && j.first_seen > prevVisit && !j.initial;
      const meta = [j.company, j.location, j.contract, j.salary].filter(Boolean).map(esc).join(" · ");
      const srcs = j.sources.map((s) => `<a class="chip" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(srcLabel(s.source))}</a>`).join("");
      const opts = STATUSES.map(([v, l]) => `<option value="${v}" ${v === status ? "selected" : ""}>${l}</option>`).join("");
      return `<article class="card job ${status === "ignored" || status === "rejected" ? "dim" : ""}">
        <div>
          <a class="t" href="${esc(j.url)}" target="_blank" rel="noopener">${j.priority ? "⭐ " : ""}${esc(j.title)}</a>
          <div class="meta">${meta}</div>
          <div class="tags">${isNew ? '<span class="chip new">Nouveau</span>' : ""}${(j.profiles || []).map((p) => `<span class="chip p">${esc(p)}</span>`).join("")}${j.to_check ? '<span class="chip chk" title="Retenue via la description, pas le titre">à vérifier</span>' : ""}${srcs}</div>
        </div>
        <div class="side">
          <span class="when" title="Détectée le ${fmtDate(j.first_seen)}">${j.initial ? "import initial · " : ""}${ago(j.first_seen)}</span>
          <select data-id="${esc(j.id)}" aria-label="Statut de candidature">${opts}</select>
        </div>
      </article>`;
    }

    function render(reset = true) {
      if (reset) { shown = PAGE; current = filter(); }
      $("count").textContent = `${current.length} offre${current.length > 1 ? "s" : ""}`;
      $("jobs").innerHTML = current.length ? current.slice(0, shown).map(card).join("")
        : `<div class="empty">Aucune offre ne correspond à ces filtres.</div>`;
      $("moreBtn").hidden = current.length <= shown;
    }

    $("jobs").addEventListener("change", (e) => {
      if (e.target.tagName !== "SELECT") return;
      const id = e.target.dataset.id;
      if (e.target.value) statuses[id] = e.target.value; else delete statuses[id];
      ls.set("radar.statuses", statuses);
      refreshApps();
      e.target.closest(".job").classList.toggle("dim", ["ignored", "rejected"].includes(e.target.value));
    });
    ["q", "fProfile", "fSource", "fPeriod", "fStatus", "fHide", "fPrio"].forEach((id) => $(id).addEventListener("input", () => render()));
    $("moreBtn").onclick = () => { shown += PAGE; render(false); };
    $("exportBtn").onclick = () => {
      const cols = ["Titre", "Entreprise", "Lieu", "Profils", "Sources", "Salaire", "Détectée le", "Statut", "Lien"];
      const label = Object.fromEntries(STATUSES);
      const rows = current.map((j) => [j.title, j.company, j.location, (j.profiles || []).join(", "), j.sources.map((s) => srcLabel(s.source)).join(", "),
        j.salary, fmtDate(j.first_seen), label[statuses[j.id] || ""], j.url]);
      const csv = [cols, ...rows].map((r) => r.map((v) => `"${String(v ?? "").replace(/"/g, '""')}"`).join(";")).join("\r\n");
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
      a.download = `radar-emploi-${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
    };
    render();
  });
})();
</script>
</body>
</html>
