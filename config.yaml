  finance:
    libelle: Finance
    requetes:
      - analyste financier junior
      - analyste financier
      - analyste fusions acquisitions
      - analyste private equity
      - contrôleur de gestion junior
    requetes_en:
      - junior financial analyst
      - investment banking analyst
      - M&A analyst
      - private equity analyst
      - FP&A analyst
      - corporate finance analyst
    mots_cles_titre:
      - analyste financier
      - analyste financière
      - analyste finance
      - analyste m&a
      - analyste fusions acquisitions
      - analyste private equity
      - analyste corporate finance
      - analyste de gestion
