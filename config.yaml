# =====================================================================
#  RADAR EMPLOI — configuration
#  C'est le seul fichier à modifier pour ajuster votre veille.
#  Les identifiants (clés API, Telegram, email) ne vont JAMAIS ici :
#  ils se mettent dans Settings > Secrets and variables > Actions sur GitHub.
#
#  Cible : premier poste (analyste / junior / graduate) en CDI dans la
#  finance, la banque, les marchés et la vente financière.
#  Zone : Paris, ou grandes places financières à l'étranger.
#  Réglages à valider avec vous : voir les lignes marquées « À CONFIRMER ».
# =====================================================================

# Adresse du tableau de bord (GitHub Pages), utilisée dans les alertes.
tableau_de_bord_url: "https://VOTRE-COMPTE.github.io/radar-emploi/"

# ---------------------------------------------------------------------
# PROFILS RECHERCHÉS
#   requetes / requetes_en : termes envoyés aux moteurs (une requête = un
#                     appel). Les requêtes françaises et anglaises sont
#                     toutes deux utilisées sur les sources françaises ;
#                     les sources étrangères n'utilisent que l'anglais.
#   mots_cles_titre : une offre est retenue si son TITRE contient l'un
#                     de ces termes (accents et majuscules ignorés,
#                     mot entier : « DAF » ne matche pas « DAFNE »).
#   mots_cles_description : (optionnel) retenue aussi si la DESCRIPTION
#                     contient l'un de ces termes — marquée « à vérifier ».
# ---------------------------------------------------------------------
